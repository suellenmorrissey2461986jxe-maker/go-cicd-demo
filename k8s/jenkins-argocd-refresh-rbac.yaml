apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-argocd-refresher
  namespace: argocd
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  resourceNames:
  - go-cicd-demo
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-argocd-refresher
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: jenkins-deployer
  namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-argocd-refresher
