apiVersion: v1
kind: Namespace
metadata:
  name: go-cicd-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-cicd-demo
  namespace: go-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-cicd-demo
  template:
    metadata:
      labels:
        app: go-cicd-demo
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/suellenmorrissey2461986jxe-maker/go-cicd-demo:10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: go-cicd-demo
  namespace: go-cicd-demo
spec:
  type: NodePort
  selector:
    app: go-cicd-demo
  ports:
    - name: http
      port: 80
      targetPort: http
