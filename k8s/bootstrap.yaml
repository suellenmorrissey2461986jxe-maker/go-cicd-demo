apiVersion: v1
kind: Namespace
metadata:
  name: go-cicd-demo

---
apiVersion: v1
kind: Service
metadata:
  name: go-cicd-demo
  namespace: go-cicd-demo
spec:
  type: NodePort
  selector:
    app: go-cicd-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31042
      protocol: TCP
